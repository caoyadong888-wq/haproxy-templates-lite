# Generated by render_haproxy.py
# kind: tcp
# Keyword behavior can change between HAProxy versions. Check upstream docs.
# This file sets no user, group, chroot, or stats socket. Check upstream docs before you add them.

global
    maxconn 2000

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout check 5s

frontend db-tcp
    bind 127.0.0.1:5432
    mode tcp
    default_backend postgres

backend postgres
    mode tcp
    balance leastconn
    # server check in mode tcp is a TCP connect check. Check upstream docs.
    server db1 192.0.2.20:5432 check
    server db2 192.0.2.21:5432 check
