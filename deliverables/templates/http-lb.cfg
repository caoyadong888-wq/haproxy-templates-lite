# Generated by render_haproxy.py
# kind: http_lb
# Keyword behavior can change between HAProxy versions. Check upstream docs.
# This file sets no user, group, chroot, or stats socket. Check upstream docs before you add them.

global
    maxconn 2000

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout check 5s

frontend edge
    bind 127.0.0.1:8080
    mode http
    acl host_api hdr(host) -i api.example.com
    acl host_web hdr(host) -i www.example.com
    use_backend api if host_api
    use_backend web if host_web
    default_backend web

backend api
    mode http
    balance roundrobin
    option httpchk GET /health
    server api1 192.0.2.12:8080 check
    server api2 192.0.2.13:8080 check

backend web
    mode http
    balance roundrobin
    option httpchk GET /health
    server web1 192.0.2.10:8080 check
    server web2 192.0.2.11:8080 check
